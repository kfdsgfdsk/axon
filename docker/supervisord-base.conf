; Static programs for the all-in-one container.
; Postgres gets its own generated conf (binary path resolved at boot) and
; approval/agent are generated only when ENABLE_APPROVAL/ENABLE_AGENT=true.
; All programs inherit the entrypoint's environment (DB URLs, secrets, ...).

[program:redis]
command=redis-server --appendonly yes --dir /data/redis --port 6379 --bind 127.0.0.1 --daemonize no
autorestart=true
autorestart_delay=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:signer]
command=node /app/dist/signer-entry.js
directory=/app
environment=NODE_OPTIONS="--dns-result-order=ipv4first"
autorestart=true
autorestart_delay=2
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:api]
command=node /app/dist/server.js
directory=/app
environment=NODE_OPTIONS="--dns-result-order=ipv4first"
autorestart=true
autorestart_delay=2
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:worker]
command=node /app/dist/worker-entry.js
directory=/app
environment=NODE_OPTIONS="--dns-result-order=ipv4first"
autorestart=true
autorestart_delay=2
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
autorestart_delay=2
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
