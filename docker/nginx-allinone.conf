# AXON all-in-one liaison: SPA + same-origin reverse proxy to the local API.
# Runs INSIDE the single container (nginx + api on 127.0.0.1:3000), so the
# browser only ever talks to ONE host — /api/*, /health, /ready are forwarded
# to the API process, and everything else serves the terminal SPA.
#
# Installed at /etc/nginx/sites-enabled/axon.conf (Debian nginx layout).
# The default Debian site is removed at build time to avoid a port-80 clash.

upstream api {
  server 127.0.0.1:3000 max_fails=3 fail_timeout=5s;
}

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Never cache the shell — always cache hashed assets.
  location = /index.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # ---- API liaison ----
  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE streams (agent crew, price ticker) must not be buffered.
    proxy_buffering off;
    proxy_cache off;
    # Above the 300s crew deadline + margin (15s heartbeats keep it alive).
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
  }

  location = /health { proxy_pass http://api; }
  location = /ready  { proxy_pass http://api; }

  # Hashed vite assets — immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback — every page route serves the shell.
  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
